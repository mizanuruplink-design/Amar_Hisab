name: amar_hisab
description: "Daily Expense Tracker with Debt Management and Reminders."
publish_to: 'none'

version: 1.0.4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.3
  pdf: ^3.11.0
  printing: ^5.11.1
  path_provider: ^2.1.2
  bangla_pdf_fixer: ^2.0.0
  http: ^1.3.0
#  open_filex: ^4.5.0
  open_file: ^3.3.2
  share_plus: ^7.2.1
  math_expressions: ^3.1.0
  signature: ^6.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  i_google_drive: ^1.0.0
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  file_picker: ^8.0.0
  # flutter_html_to_pdf: ^0.7.0
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  flutter_screen_lock: ^9.0.1
  webview_flutter: ^4.8.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.0
  rxdart: ^0.27.7
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  intl: ^0.20.2
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#004B49"
  image: assets/images/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#004B49"
    image: assets/images/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/kalpurush.ttf
    - assets/fonts/NotoSansBengali-Regular.ttf
    - assets/fonts/SolaimanLipi.ttf
    - assets/images/

  fonts:
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/kalpurush.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
    - family: SolaimanLipi
      fonts:
        - asset: assets/fonts/SolaimanLipi.ttf