name: amar_hisab
description: "Daily Expense Tracker with Debt Management and Reminders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.3
  pdf: ^3.11.0
  printing: ^5.11.1
  path_provider: ^2.1.2
  open_file: ^3.3.2
  share_plus: ^7.2.1
  math_expressions: ^3.1.0
  signature: ^6.3.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  local_auth: ^2.1.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  flutter_screen_lock: ^9.0.1
  webview_flutter: ^4.8.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # --- নোটিফিকেশন ও রিমাইন্ডার ---
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # --- ফায়ারবেস এবং গুগল লগইন ---
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_database: ^11.0.1
  google_sign_in: ^6.2.1

  # --- ইউটিলিটি এবং ডিজাইন ---
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0
  offline_sync: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# আইকন সেট করার কনফিগারেশন (এখানে লোগোর পাথ দিন)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png" # নিশ্চিত করুন এই পাথে আপনার লোগোটি আছে
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/ # লোগো ইমেজের জন্য এই ফোল্ডারটিও অ্যাড করে রাখুন