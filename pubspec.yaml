name: amar_hisab
description: "Daily Expense Tracker with Debt Management and Reminders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.3
  pdf: ^3.11.0
  printing: ^5.11.1
  path_provider: ^2.1.2

  # 🟢 ফিক্সড: পুরানো open_file কেটে গ্রেডল ক্র্যাশ এড়াতে লেটেস্ট open_filex যুক্ত করা হলো
  open_filex: ^4.5.0

  # 🟢 নতুন যুক্ত: প্রতি স্ক্রিনে বিজ্ঞাপন দেখানোর অফিশিয়াল AdMob প্লাগইন
  #google_mobile_ads: ^5.1.0

  share_plus: ^7.2.1
  math_expressions: ^3.1.0
  signature: ^6.3.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  local_auth: ^2.1.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  flutter_screen_lock: ^9.0.1
  webview_flutter: ^4.8.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.0
  rxdart: ^0.27.7

  # --- নোটিফিকেশন ও রিমাইন্ডার ---
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # --- ফায়ারবেস এবং গুগল লগইন ---
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_database: ^11.0.1
  google_sign_in: ^6.2.1
  firebase_remote_config: ^5.0.0


  # --- ইউটিলিটি এবং ডিজাইন ---
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0
  offline_sync: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ========== LAUNCHER ICON CONFIGURATION ==========
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"   # Replace with your actual logo path
  min_sdk_android: 21

# ========== NATIVE SPLASH SCREEN ==========
flutter_native_splash:
  color: "#004B49"
  image: assets/images/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

  # 🟢 অ্যান্ড্রয়েড ১২+ এর নতুন স্প্ল্যাশ স্ক্রিন সেফগার্ড
  android_12:
    color: "#004B49"
    image: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansBengali.ttf
    - assets/images/